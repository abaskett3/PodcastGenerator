name: Pull request

# Starts on every pull request. There is deliberately no branch or path filter here: a workflow skipped by a filter leaves
# its checks "Pending" and blocks a pull request that requires them
# (https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks).
# Instead each job always runs and skips its build and test steps when only ignored files changed, so the job still
# reports success. The default pull_request activity types (opened, synchronize, reopened) are used.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # These names are the required status checks named in README.md. Keep them stable.
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find out whether anything besides ignored files changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-renames lists both sides of a rename, so a file moved into an ignored folder still counts as changed code.
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" | bash .github/scripts/classify-changes.sh | tee -a "$GITHUB_OUTPUT"

      - name: Nothing to build (only ignored files changed)
        if: steps.changes.outputs.code != 'true'
        run: echo "Only ignored files changed (docs, .github, .claude, agent-memory, .gitignore, *.md). Build and tests are skipped."

      - name: Set up the .NET 10 SDK
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build -warnaserror --no-restore

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: dotnet test --no-build
