name: Pull request title

# The squash-merge commit subject is the pull request title, and the release workflow reads it to decide the version bump
# (CLAUDE.md, "Source Control"). This check makes a non-conforming title fail before the merge.
# "edited" makes the check run again when the title is changed, so fixing the title needs no new commit. "synchronize"
# reports the check for each new head commit, because a required check must pass on the latest commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  validate-title:
    # This name is a required status check named in README.md. Keep it stable and unique across workflows.
    name: PR title (conventional commit)
    runs-on: ubuntu-latest
    steps:
      - name: Check the title against Conventional Commits 1.0.0
        env:
          # Passed through the environment, never interpolated into the script, so a title cannot inject shell commands.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # type(optional scope)optional !: description   e.g. "feat(cli): add a flag" or "fix!: change the output format"
          pattern='^[A-Za-z]+(\([^()]+\))?!?: [^[:space:]].*$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "The title is a valid conventional commit: $PR_TITLE"
            exit 0
          fi
          echo "::error title=Pull request title::The title must follow Conventional Commits 1.0.0: 'type: description', 'type(scope): description' or 'type!: description'. Types such as feat (minor release), fix (patch release) or a '!' (major release) decide the version; refactor, test, chore, ci and docs publish no release. Edit the title and this check runs again."
          echo "Title was: $PR_TITLE"
          exit 1
